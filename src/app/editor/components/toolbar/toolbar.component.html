<div class="toolbar">
  <button class="tool-btn" 
          [class.active]="currentTool() === 'tuning'"
          (click)="onSetTool('tuning')">
    <svg class="tool-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round">

      <path d="M20 2v4"></path>
      <path d="M22 4h-4"></path>
      <circle cx="4" cy="20" r="2"></circle>
    </svg>
    <span class="tool-label">TUNING</span>
  </button>

  <button class="tool-btn"
          [class.active]="currentTool() === 'crop'"
          (click)="onSetTool('crop')">
    <svg class="tool-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2v14a2 2 0 0 0 2 2h14"></path>
      <path d="M18 22V8a2 2 0 0 0-2-2H2"></path>
    </svg>
    <span class="tool-label">CROP</span>
  </button>

  <button class="tool-btn"
          (click)="onFlip()">
    <svg class="tool-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round">

      <path d="M13.3334 10H11.6667"/>
      <path d="M18.3334 10H16.6667"/>
    </svg>
    <span class="tool-label">FLIP</span>
  </button>

    </svg>
    <span class="tool-label">ICON</span>
  </button>

          [class.active]="currentTool() === 'text'"
          (click)="onTextTool()">
    <svg class="tool-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">

  <button class="tool-btn" 
          [class.active]="currentTool() === 'watermark'"
          (click)="onSetTool('watermark')">
    <svg class="tool-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">

    <svg class="tool-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">

      <path d="M13.3334 15V18.3333" stroke="currentColor" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="tool-label">FILTER</span>
  </button>

          [class.active]="currentTool() === 'corner'" 
          (click)="onSetTool('corner')">
    <svg class="tool-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
